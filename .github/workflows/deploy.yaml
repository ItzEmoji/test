name: Publish to docs log

on:
  push:
    branches: [main]

# Two pushes in quick succession would otherwise race on the docs checkout.
# Queue them instead of cancelling: a run killed between "merge" and
# "delete-branch" leaves debris behind.
concurrency:
  group: publish-log
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Every write goes through the App token scoped to docs, so nothing here
    # needs any permission on this repository.
    permissions: {}
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_KEY }}
          owner: ItzEmoji
          repositories: docs

      # Author and committer must be the same identity, or GitHub renders the
      # commit as "ItzEmoji and itzemoji-ci[bot]". The <id>+<slug>[bot]@... form
      # is what links the commit to the bot account.
      - name: Resolve the app's bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          user_id="$(gh api "/users/${SLUG}[bot]" --jq .id)"

          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ItzEmoji/docs
          token: ${{ steps.app-token.outputs.token }}
          path: docs

      # Newest first, so the interesting end of the file is the top.
      - name: Prepend the entry
        id: entry
        working-directory: docs
        # Passed as env rather than interpolated into the script: a commit
        # message is attacker-controlled text and would otherwise be pasted
        # verbatim into the shell.
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail

          # head_commit.message carries the full body; keep the subject only.
          SUBJECT="${SUBJECT%%$'\n'*}"
          SHORT="${GITHUB_SHA:0:7}"
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          # cat log.md > log.md would truncate before reading; stage the
          # rewrite in a temp file.
          touch log.md
          { echo "- \`$(date -u +%Y-%m-%d)\` [\`${SHORT}\`](${URL}) ${SUBJECT} — ${AUTHOR}"
            cat log.md
          } > log.md.new
          mv log.md.new log.md

          echo "subject=log: ${SHORT} ${SUBJECT}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: docs
          # Defaults are github.actor for author and github-actions[bot] for
          # committer — two different people, hence the split attribution.
          committer: ${{ steps.bot.outputs.name }} <${{ steps.bot.outputs.email }}>
          author: ${{ steps.bot.outputs.name }} <${{ steps.bot.outputs.email }}>
          base: main
          branch: log/${{ github.sha }}
          delete-branch: true
          # Without this the commit subject falls back to the action's
          # "[create-pull-request] automated change".
          commit-message: ${{ steps.entry.outputs.subject }}
          title: ${{ steps.entry.outputs.subject }}
          body: |
            Automated log entry from [`${{ github.repository }}`][src].

            [src]: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

      # Guarded so a re-run of an already-published SHA, where the branch
      # already exists and no new pull request is created, exits cleanly.
      - name: Merge the pull request
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --repo ItzEmoji/docs --rebase --delete-branch "$PR"
