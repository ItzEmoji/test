# .github/workflows/notify-docs.yml
name: Notify docs monorepo
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_KEY }}
          owner: itzemoji
          repositories: docs-test

      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api user --jq .login || echo "installation token (no user)"
          gh api repos/itzemoji/docs-test --jq .permissions
