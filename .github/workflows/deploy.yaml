name: Publish docs

on:
  push:
    branches: [main]

concurrency:
  group: publish-docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: cd website && bun install --frozen-lockfile
      # Docusaurus needs baseUrl at build time or every asset URL is wrong.
      - run: bun run build
        env:
          DOCS_BASE_PATH: /test/

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_KEY }}
          owner: ItzEmoji
          repositories: docs-test

      - uses: actions/checkout@v4
        with:
          repository: ItzEmoji/docs-test
          token: ${{ steps.app-token.outputs.token }}
          path: site

      - name: Replace the project's directory
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Delete first: Docusaurus emits content-hashed filenames, so a plain
          # copy would leave every previous build's assets behind forever.
          rm -rf site/test
          mkdir -p site/test
          cp -a build/. site/test/

          cd site
          git config user.name  "itzemoji-ci[bot]"
          git config user.email "itzemoji-ci[bot]@users.noreply.github.com"

          git add test
          git diff --cached --quiet && { echo "no change"; exit 0; }

          git commit -m "test: ${SUBJECT%%$'\n'*}"

          # Another project may have pushed between our clone and now.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
